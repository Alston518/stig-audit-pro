[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stig_audit_pro*"]

[project]
name = "stig-audit-pro"
version = "0.2.0"
description = "Read-only Cisco IOS-XE STIG evidence and audit application"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "netmiko>=4.5,<5",
  "customtkinter>=5.2.2,<6",
  "packaging>=24,<27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "types-PyYAML>=6.0.12,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "data/stigs/cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ['(^|[\\/])\.venv[\\/]', '^stig_audit_pro[\\/]gui[\\/]']
