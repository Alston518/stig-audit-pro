- vuln_id: CISC-ND-000160
  title: The Cisco switch must be configured to display the Standard Mandatory DoD Notice and Consent Banner before granting
    access to the device.
  stig_family: IOSXE_NDM
  severity: cat2
  check_type: manual_review
  commands: []
  automated: false
  stig_id: CISC-ND-000160
  group_id: V-220525
  rule_id: SV-220525r960843_rule
  source_benchmark: Cisco IOS XE Switch NDM Security Technical Implementation Guide
  source_version: '3'
  source_release: 'Release: 6 Benchmark Date: 01 Apr 2026'
  check_text: 'Review the Cisco switch configuration to verify that it is compliant with this requirement as shown in the
    example below: banner login ^C You are accessing a U.S. Government (USG) Information System (IS) that is provided for
    USG-authorized use only. By using this IS (which includes any device attached to this IS), you consent to the following
    conditions: -The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited
    to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement
    (LE), and counterintelligence (CI) investigations. -At any time, the USG may inspect and seize data stored on this IS.
    -Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and
    search, and may be disclosed or used for any USG-authorized purpose. -This IS includes security measures (e.g., authentication
    and access controls) to protect USG interests--not for your personal benefit or privacy. -Notwithstanding the above, using
    this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged
    communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy,
    and their assistants. Such communications and work product are private and confidential. See User Agreement for details.
    ^C If the Cisco switch is not configured to display the Standard Mandatory DoD Notice and Consent Banner before granting
    access to the device, this is a finding.'
  fix_text: 'Configure the Cisco switch to display the Standard Mandatory DoD Notice and Consent Banner before granting access
    as shown in the following example: SW1(config)#banner login # Enter TEXT message. End with the character ''#''. You are
    accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only. By using this
    IS (which includes any device attached to this IS), you consent to the following conditions: -The USG routinely intercepts
    and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring,
    network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.
    -At any time, the USG may inspect and seize data stored on this IS. -Communications using, or data stored on, this IS
    are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized
    purpose. -This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not
    for your personal benefit or privacy. -Notwithstanding the above, using this IS does not constitute consent to PM, LE
    or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal
    representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work
    product are private and confidential. See User Agreement for details. # SW1(config)#end'
  parser: {}
