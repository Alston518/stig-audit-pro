- vuln_id: CISC-ND-000140
  title: The Cisco switch must be configured to enforce approved authorizations for controlling the flow of management information
    within the device based on control policies.
  stig_family: IOSXE_NDM
  severity: cat2
  check_type: manual_review
  commands: []
  automated: false
  stig_id: CISC-ND-000140
  group_id: V-220523
  rule_id: SV-220523r1137875_rule
  source_benchmark: Cisco IOS XE Switch NDM Security Technical Implementation Guide
  source_version: '3'
  source_release: 'Release: 6 Benchmark Date: 01 Apr 2026'
  check_text: 'Review the Cisco switch configuration to verify that it is compliant with this requirement. Administrative
    access to the switch must only be allowed from hosts residing in the management network. Step 1: Verify that the line
    vty has an ACL inbound applied as shown in the example below: line vty 0 1 access-class MANAGEMENT_NET in transport input
    ssh Step 2: Verify that the ACL permits only hosts from the management network to access the switch. ip access-list extended
    MANAGEMENT_NET permit ip x.x.x.0 0.0.0.255 any deny ip any any log-input If the Cisco switch is not configured to enforce
    approved authorizations for controlling the flow of management information within the device based on control policies,
    this is a finding.'
  fix_text: 'Configure the Cisco switch to restrict management access to specific IP addresses via SSH as shown in the example
    below: SW2(config)#ip access-list standard MANAGEMENT_NET SW2(config-std-nacl)#permit x.x.x.0 0.0.0.255 SW2(config-std-nacl)#exit
    SW2(config)#line vty 0 1 SW2(config-line)#transport input ssh SW2(config-line)#access-class MANAGEMENT_NET in SW2(config-line)#end'
  parser: {}
  scope: {}
  conditions: {}
  result:
    pass_status: NotAFinding
    fail_status: Not_Reviewed
    error_status: Error
  evidence:
    include_command_output: false
    include_failed_objects: false
    pass_comment: Manual review completed and requirement was marked NotAFinding.
    fail_comment: Manual review required. Review the imported STIG check text and customer/site tailoring.
    error_comment: Manual review check could not be prepared.
    finding_details_template: manual_review
