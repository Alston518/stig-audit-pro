- vuln_id: CISC-ND-001410
  title: The Cisco switch must be configured to support organizational requirements to conduct backups of the configuration
    when changes occur.
  stig_family: IOSXE_NDM
  severity: cat2
  check_type: manual_review
  commands: []
  automated: false
  stig_id: CISC-ND-001410
  group_id: V-220566
  rule_id: SV-220566r1186357_rule
  source_benchmark: Cisco IOS XE Switch NDM Security Technical Implementation Guide
  source_version: '3'
  source_release: 'Release: 6 Benchmark Date: 01 Apr 2026'
  check_text: 'Review the Cisco switch configuration to verify that it is configured to automatically back up its running
    configuration to a remote server when a change is made. The example configuration below will send the configuration to
    a SCP server when a configuration change occurs. Verify that an Embedded Event Manager (EEM) applet is configured to trigger
    on the syslog message "%SYS-5-CONFIG_I". Verify the EEM applet contains an action to copy the running configuration to
    a secure server (e.g., SCP). Verify the command authorization bypass is present within the applet to ensure it executes
    correctly under AAA. Verify the global command file prompt quiet is configured to prevent the applet from timing out.
    Verify the authentication method used for the file transfer: The command "copy running-config scp://<username>@<x.x.x.x>/<path_on_server>/$_info_routername-running-config".
    Note: The absence of a password indicates the use of secure public/private key authentication. If the Cisco switch is
    not configured to conduct automated backups of the configuration when changes occur, or if it does so using an insecure
    method like a cleartext password, this is a finding.'
  fix_text: Configure the Cisco switch to send the configuration to an SCP server when a configuration change occurs. The
    recommended and most secure method is to use public/private key authentication. SW4(config)# ip scp server enable SW4(config)#
    file prompt quiet SW4(config)# event manager applet BACKUP_CONFIG SW4(config-applet)# event syslog pattern "%SYS-5-CONFIG_I"
    SW4(config-applet)# action 1 cli command "enable" SW4(config-applet)# action 2 info type routername SW4(config-applet)#
    action 3 cli command "copy running-config scp://<username>@<x.x.x.x>/<path_on_server>/$_info_routername-running-config"
    SW4(config-applet)# action 4 syslog priority informational msg "Configuration backup executed for $_info_routername" SW4(config-applet)#
    authorization bypass SW4(config-applet)# end
  parser: {}
  scope: {}
  conditions: {}
