- vuln_id: CISC-ND-000010
  title: The Cisco switch must be configured to limit the number of concurrent management sessions to an organization-defined
    number.
  stig_family: IOSXE_NDM
  severity: cat2
  check_type: manual_review
  commands: []
  automated: false
  stig_id: CISC-ND-000010
  group_id: V-220518
  rule_id: SV-220518r960735_rule
  source_benchmark: Cisco IOS XE Switch NDM Security Technical Implementation Guide
  source_version: '3'
  source_release: 'Release: 6 Benchmark Date: 01 Apr 2026'
  check_text: 'Note: This requirement is not applicable to file transfer actions such as FTP, SCP, and SFTP. Review the switch
    configuration to determine if concurrent management sessions are limited as show in the example below: ip http secure-server
    ip http max-connections 2 … … … For platforms that support the session-limit command: line vty 0 4 session-limit 2 transport
    input ssh For those platforms that do not support the session-limit command, the sessions can also be limited by reducing
    the number of active vty lines as shown in the example below. line vty 0 1 transport input ssh line vty 2 4 transport
    input none If the switch is not configured to limit the number of concurrent management sessions, this is a finding.'
  fix_text: 'Configure the switch to limit the number of concurrent management sessions to an organization-defined number
    as shown in the example below: SW4(config)#ip http max-connections 2 SW4(config)#line vty 0 1 SW4(config)#transport input
    ssh SW4(config)#line vty 2 4 SW4(config)#transport input none'
