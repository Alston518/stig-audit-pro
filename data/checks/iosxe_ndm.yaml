- vuln_id: CISC-ND-000090
  title: The Cisco switch must be configured to automatically audit account creation.
  stig_family: IOSXE_NDM
  severity: cat2
  check_type: manual_review
  commands: []
  automated: false
  stig_id: CISC-ND-000090
  group_id: V-220519
  rule_id: SV-220519r1186338_rule
  source_benchmark: Cisco IOS XE Switch NDM Security Technical Implementation Guide
  source_version: '3'
  source_release: 'Release: 6 Benchmark Date: 01 Apr 2026'
  check_text: 'Review the switch configuration to determine if it automatically audits account creation. The configuration
    should look similar to the example below: archive log config logging enable Note: Configuration changes can be viewed
    using the show archive log config all command. If account creation is not automatically audited, this is a finding.'
  fix_text: 'Configure the switch to log account creation using the following commands: SW4(config)#archive SW4(config-archive)#log
    config SW4(config-archive-log-cfg)#logging enable SW4(config-archive-log-cfg)#logging size 1000 SW4(config-archive-log-cfg)#notify
    syslog contenttype plaintext SW4(config-archive-log-cfg)#hidekeys SW4(config-archive-log-cfg)#end'
