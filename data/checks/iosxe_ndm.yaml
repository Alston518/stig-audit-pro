  source_benchmark: Cisco IOS XE Switch NDM Security Technical Implementation Guide
  source_version: '3'
  source_release: 'Release: 6 Benchmark Date: 01 Apr 2026'
  check_text: 'Review the Cisco switch configuration to verify the device is configured to use at least two authentication
    servers as the primary source for authentication as shown in the following example: aaa new-model ! aaa group server radius
    RADIUS_GROUP server name RADIUS1 server name RADIUS2 ! aaa authentication login CONSOLE group RADIUS_GROUP local aaa authentication
    login LOGIN_AUTHENTICATION group RADIUS_GROUP local … … … ip http authentication aaa login-authentication LOGIN_AUTHENTICATION
    ip http secure-server … … … radius server RADIUS1 address ipv4 x.x.x.x auth-port 1812 acct-port 1813 key xxxxxxx ! radius
    server RADIUS2 address ipv4 x.x.x.x auth-port 1812 acct-port 1813 key xxxxxxx … … … line con 0 exec-timeout 5 0 login
    authentication CONSOLE line vty 0 1 exec-timeout 5 0 login authentication LOGIN_AUTHENTICATION If the Cisco switch is
    not configured to use at least two authentication servers for the purpose of authenticating users prior to granting administrative
    access, this is a finding.'
  fix_text: 'Step 1: Configure the Cisco switch to use at least two authentication servers as shown in the following example:
    R4(config)#radius server RADIUS1 R4(config-radius-server)#address ipv4 x.x.x.x auth-port 1812 acct-port 1813 R4(config-radius-server)#key
    xxxxxxx R4(config-radius-server)#radius server RADIUS2 R4(config-radius-server)#address ipv4 x.x.x.x auth-port 1812 acct-port
    1813 R4(config-radius-server)#key xxxxxxx Step 2: Configure the authentication order to use the authentication servers
    as the primary source for authentication as shown in the following example: R4(config)#aaa group server radius RADIUS_GROUP
    R4(config)#server name RADIUS1 R4(config)#server name RADIUS2 R4(config)#aaa authentication login CONSOLE group RADIUS_GROUP
    local R4(config)#aaa authentication login LOGIN_AUTHENTICATION group RADIUS_GROUP local Step 3: Configure all network
    connections associated with a device management to use the authentication servers for the purpose of login authentication.
    R4(config)#line vty 0 1 R4(config-line)#login authentication LOGIN_AUTHENTICATION R4(config-line)#exit R4(config)#line
    con 0 R4(config-line)#login authentication CONSOLE R4(config-line)#exit R4(config)#ip http authentication aaa login-authentication
