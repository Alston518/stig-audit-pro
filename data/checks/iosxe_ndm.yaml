    the URL of the CA in which the switch has enrolled with. Verify this is a DOD or DOD-approved CA. This will ensure the
    switch has enrolled and received a certificate from a trusted CA. The CA trust point configuration would look similar
    to the example below: crypto pki trustpoint CA_X enrollment url http://trustpoint1.example.com Note: A remote end-point''s
    certificate will always be validated by the switch by verifying the signature of the CA on the certificate using the CA''s
    public key, which is contained in the switch''s certificate it received at enrollment. If the Cisco switch is not configured
    to obtain its public key certificates from an appropriate certificate policy through an approved service provider, this
    is a finding.'
