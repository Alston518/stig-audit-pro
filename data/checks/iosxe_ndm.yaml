- vuln_id: CISC-ND-000380
  title: The Cisco switch must be configured to protect audit information from unauthorized modification.
  stig_family: IOSXE_NDM
  severity: cat2
  check_type: manual_review
  commands: []
  automated: false
  stig_id: CISC-ND-000380
  group_id: V-220531
  rule_id: SV-220531r960933_rule
  source_benchmark: Cisco IOS XE Switch NDM Security Technical Implementation Guide
  source_version: '3'
  source_release: 'Release: 6 Benchmark Date: 01 Apr 2026'
  check_text: 'Review the Cisco switch configuration to verify that it is compliant with this requirement. Step 1: If persistent
    logging is enabled as shown in the example below, go to Step 2. Otherwise, this requirement is not applicable. logging
    persistent url disk0:/logfile size 134217728 filesize 16384 Step 2: Verify that the switch is not configured with a privilege
    level other than "15" to allow access to the file system as shown in the example below: file privilege 10 Note: The default
    privilege level required for access to the file system is "15"; hence, the command file privilege "15" will not be shown
    in the configuration. If the switch is configured with a privilege level other than "15" to allow access to the file system,
    this is a finding.'
  fix_text: 'If persistent logging is enabled, configure the switch to only allow administrators with privilege level "15"
    access to the file system as shown in the example below: SW4(config)#file privilege 15'
  parser: {}
  scope: {}
  conditions: {}
  result:
    pass_status: NotAFinding
    fail_status: Not_Reviewed
