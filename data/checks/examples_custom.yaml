library_name: examples_custom
check_pack_version: 1.0.0
schema_version: 1
minimum_app_version: 0.2.0
checks:
- vuln_id: EXAMPLE-ACL-LOG-INPUT
  custom_check_id: EXAMPLE-ACL-LOG-INPUT
  control_origin: example
  include_in_official_totals: false
  title: ACL deny statements must use log-input.
  stig_family: CUSTOM
  severity: cat2
  check_type: command_pattern_policy
  commands:
  - show running-config
  - show ip access-lists
  automated: true
  parser: {}
  scope: {}
  conditions:
    none:
    - command: show running-config
      pattern: (?im)^\s*(?:access-list\s+\S+\s+)?(?:\d+\s+)?deny\b(?:(?!\blog-input\b).)*$
      description: deny statement missing log-input in running-config
      object_type: acl_statement
      object_name: running-config deny
    - command: show ip access-lists
      pattern: (?im)^\s*(?:\d+\s+)?deny\b(?:(?!\blog-input\b).)*$
      description: deny statement missing log-input in show ip access-lists
      object_type: acl_statement
      object_name: show access-list deny
  result:
    pass_status: NotAFinding
    fail_status: Open
    error_status: Error
  evidence:
    include_command_output: false
    include_failed_objects: true
    pass_comment: No deny strings were found without log-input.
    fail_comment: One or more deny strings are missing log-input.
    error_comment: ACL deny log-input string validation could not be evaluated.
    finding_details_template: default
