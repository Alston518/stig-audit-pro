- vuln_id: CISC-L2-000130
  title: The Cisco switch must have DHCP snooping for all user VLANs to validate DHCP messages from untrusted sources.
  stig_family: IOSXE_L2
  severity: cat2
  check_type: dhcp_snooping_policy
  commands:
  - show running-config
  - show ip dhcp snooping
  automated: true
  stig_id: CISC-L2-000130
  group_id: V-220659
  rule_id: SV-220659r928999_rule
  source_benchmark: Cisco IOS XE Switch L2S Security Technical Implementation Guide
  source_version: '3'
  source_release: 'Release: 2 Benchmark Date: 02 Jul 2025'
  check_text: 'Review the switch configuration and verify that DHCP snooping is enabled on all user VLANs as shown in the
    example below: hostname SW2 … … … ip dhcp snooping vlan 2,4-8,11 ip dhcp snooping Note: Switchports assigned to a user
    VLAN would have drops in the area where the user community would reside; hence, the "untrusted" term is used. Server and
    printer VLANs would not be applicable. If the switch does not have DHCP snooping enabled for all user VLANs to validate
    DHCP messages from untrusted sources, this is a finding.'
  fix_text: 'Configure the switch to have DHCP snooping for all user VLANs to validate DHCP messages from untrusted sources
    as shown in the example below: SW2(config)#ip dhcp snooping SW2(config)#ip dhcp snooping vlan 2,4-8,11'
  parser: {}
  scope: {}
  conditions:
    all:
    - field: global_enabled
      op: equals
      value: true
    - field: snooping_vlans
      op: includes_profile_list
      profile_key: dhcp_snooping.vlans
  result:
    pass_status: NotAFinding
    fail_status: Open
    error_status: Error
  evidence:
    include_command_output: false
    include_failed_objects: true
    pass_comment: DHCP snooping is enabled for all required VLANs.
    fail_comment: DHCP snooping is missing globally or missing required VLANs.
    error_comment: DHCP snooping could not be evaluated.
    finding_details_template: default
