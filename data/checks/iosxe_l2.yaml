  source_benchmark: Cisco IOS XE Switch L2S Security Technical Implementation Guide
  source_version: '3'
  source_release: 'Release: 2 Benchmark Date: 02 Jul 2025'
  check_text: 'In cases where VLANs do not span multiple switches, it is a best practice to not implement STP. Avoiding the
    use of STP will provide the most deterministic and highly available network topology. If STP is required, then review
    the switch configuration to verify that Rapid STP has been implemented. hostname SW2 … … … spanning-tree mode rapid-pvst
    Note: Multiple STP (MSTP) can be configured as an alternate mode. MSTP which uses RSTP for rapid convergence and enables
    multiple VLANs to be grouped into and mapped to the same spanning-tree instance; thereby reducing the number of spanning-tree
    instances needed to support a large number of VLANs. If either RSTP or MSTP has not been implemented where STP is required,
    this is a finding.'
  fix_text: 'Configure Rapid STP or MSTP to be implemented at the access and distribution layers where VLANs span multiple
    switches as shown in the examples below: SW2(config)#spanning-tree mode rapid-pvst or SW1(config)#spanning-tree mode mst'
