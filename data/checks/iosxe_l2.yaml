- vuln_id: V-220659
  stig_id: CISC-L2-000130
  title: The Cisco switch must have DHCP snooping for all user VLANs to validate DHCP messages from untrusted sources.
  looking_for: Looking for specific vlan numbers in "show run | inc "ip dhcp snooping"
  stig_family: IOSXE_L2
  severity: cat2
  check_type: command_pattern_policy
  commands:
  - show running-config
  automated: true
  scope: {}
  conditions:
    all:
    - command: show running-config
      pattern: ^\s*ip dhcp snooping\s*$
      description: global ip dhcp snooping enabled
    profile_all:
    - command: show running-config
      profile_key: dhcp_snooping.vlans
      object_type: vlan
      pattern_template: ^\s*ip dhcp snooping vlan\s+.*(?<!\d){{ item }}(?!\d).*$
      description_template: DHCP snooping VLAN {{ item }}
  result:
