- vuln_id: CISC-L2-000210
  title: The Cisco switch must have all disabled switch ports assigned to an unused VLAN.
  stig_family: IOSXE_L2
  severity: cat2
  check_type: interface_policy
  commands:
  - show running-config
  - show interfaces status
  automated: true
  stig_id: CISC-L2-000210
  group_id: V-220667
  rule_id: SV-220667r991904_rule
  source_benchmark: Cisco IOS XE Switch L2S Security Technical Implementation Guide
  source_version: '3'
  source_release: 'Release: 2 Benchmark Date: 02 Jul 2025'
  check_text: 'Step 1: Review the switch configurations and examine all access switch ports. Each access switch port not in
    use should have membership to an inactive VLAN. interface GigabitEthernet0/0 switchport access vlan 999 shutdown ! interface
    GigabitEthernet0/1 switchport access vlan 999 shutdown … … … interface GigabitEthernet0/9 switchport access vlan 999 shutdown
    Step 2: Verify that traffic from the inactive VLAN is not allowed on any trunk links as shown in the example below: interface
    GigabitEthernet1/1 switchport trunk allowed vlan 1-998,1000-4094 switchport trunk encapsulation dot1q switchport mode
    trunk Note: Switch ports configured for 802.1x are exempt from this requirement. If there are any access switch ports
    not in use and not in an inactive VLAN, this is a finding.'
  fix_text: 'Assign all switch ports not in use to an inactive VLAN. Step 1: Assign the disabled interfaces to an inactive
    VLAN. SW3(config)#int range g0/0 – 9 SW3(config-if-range)# switchport access vlan 999 Step 2: Configure trunk links to
    not allow traffic from the inactive VLAN. SW3(config)#int g1/1 SW3(config-if)#switchport trunk allowed vlan except 999'
  parser: {}
  scope:
    interfaces:
      include:
      - type: physical
        match:
          admin_state: disabled_or_notconnect
  conditions:
    all:
    - field: shutdown
      op: equals
      value: true
    - field: access_vlan
      op: equals_profile_value
      profile_key: unused_vlan
  result:
    pass_status: NotAFinding
    fail_status: Open
    error_status: Error
  evidence:
    include_command_output: false
    include_failed_objects: true
    pass_comment: All disabled/not-connected access interfaces are shutdown and assigned to unused VLAN {{ unused_vlan }}.
    fail_comment: One or more disabled/not-connected interfaces are not shutdown and/or not assigned to unused VLAN {{ unused_vlan
      }}.
    error_comment: Disabled port policy could not be evaluated.
    finding_details_template: default
