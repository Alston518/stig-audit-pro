- vuln_id: CISC-L2-000260
  title: The Cisco switch must have the native VLAN assigned to an ID other than the default VLAN for all 802.1q trunk links.
  stig_family: IOSXE_L2
  severity: cat2
  check_type: manual_review
  commands: []
  automated: false
  stig_id: CISC-L2-000260
  group_id: V-220672
  rule_id: SV-220672r991909_rule
  source_benchmark: Cisco IOS XE Switch L2S Security Technical Implementation Guide
  source_version: '3'
  source_release: 'Release: 2 Benchmark Date: 02 Jul 2025'
  check_text: 'Review the switch configurations and examine all trunk links. Verify the native VLAN has been configured to
    a VLAN ID other than the ID of the default VLAN (i.e. VLAN 1) as shown in the example below: interface GigabitEthernet0/1
    switchport trunk encapsulation dot1q switchport trunk native vlan 44 switchport mode trunk negotiation auto Note: An alternative
    to configuring a dedicated native VLAN is to ensure that all native VLAN traffic is tagged. This will mitigate the risk
    of VLAN hopping since there will always be an outer tag for native traffic as it traverses an 802.1q trunk link. If the
    native VLAN has the same VLAN ID as the default VLAN, this is a finding.'
  fix_text: 'To ensure the integrity of the trunk link and prevent unauthorized access, the ID of the native VLAN of the trunk
    port must be changed from the default VLAN (i.e., VLAN 1) to its own unique VLAN ID. SW1(config)#int g0/1 SW1(config-if)#switchport
    trunk native vlan 44 Note: The native VLAN ID must be the same on both ends of the trunk link; otherwise, traffic could
    accidentally leak between broadcast domains.'
