  source_version: '3'
  source_release: 'Release: 2 Benchmark Date: 02 Jul 2025'
  check_text: 'Review the switch configuration to verify that IGMP or MLD snooping has been configured for IPv4 and IPv6 multicast
    traffic respectively. Below is an example of the steps to verify that IGMP snooping is enabled for each VLAN. Step 1:
    Verify that IGMP or MLD snooping is enabled globally. By default, IGMP snooping is enabled globally; hence, the following
    command should not be in the switch configuration: no ip igmp snooping Step 2: Verify that IGMP snooping is not disabled
    for any VLAN as shown in the example below: no ip igmp snooping vlan 11 Note: When globally enabled, it is also enabled
    by default on all VLANs, but can be disabled on a per-VLAN basis. If global snooping is disabled, VLAN snooping cannot
    be enabled. If the switch is not configured to implement IGMP or MLD snooping for each VLAN, this is a finding.'
  fix_text: Configure IGMP or MLD snooping for IPv4 and IPv6 multicast traffic respectively globally. SW1(config)#ip igmp
    snooping
