- vuln_id: CISC-L2-000230
  title: The Cisco switch must have the default VLAN pruned from all trunk ports that do not require it.
  stig_family: IOSXE_L2
  severity: cat2
  check_type: trunk_vlan_policy
  commands:
  - show running-config
  - show interfaces trunk
  automated: true
  stig_id: CISC-L2-000230
  group_id: V-220669
  rule_id: SV-220669r991906_rule
  source_benchmark: Cisco IOS XE Switch L2S Security Technical Implementation Guide
  source_version: '3'
  source_release: 'Release: 2 Benchmark Date: 02 Jul 2025'
  check_text: Review the switch configuration and verify that the default VLAN is pruned from trunk links that do not require
    it. SW1#show interfaces trunk Port Mode Encapsulation Status Native vlan Gi0/1 on 802.1q trunking 1 Gi0/2 on 802.1q trunking
    1 Port Vlans allowed on trunk Gi0/1 1-998,1000-4094 Gi0/2 1-4094 If the default VLAN is not pruned from trunk links that
    should not be transporting frames for the VLAN, this is a finding.
  fix_text: Prune VLAN 1 from any trunk links as necessary. SW1(config)#int g0/2 SW1(config-if)#switchport trunk allowed vlan
    except 1 Verify VLAN 1 is not allowed on the trunk link. SW1#show interfaces trunk Port Mode Encapsulation Status Native
    vlan Gi0/1 on 802.1q trunking 1 Gi0/2 on 802.1q trunking 1 Port Vlans allowed on trunk Gi0/1 1-998,1000-4094 Gi0/2 2-4094
  parser: {}
  scope:
    interfaces:
      mode: trunk
  conditions:
    all:
    - field: allowed_vlans
      op: excludes
      value: 1
    - field: allowed_vlans
      op: excludes_profile_list
      profile_key: additional_pruned_vlans
  result:
    pass_status: NotAFinding
    fail_status: Open
    error_status: Error
  evidence:
