  severity: cat3
  check_type: root_guard_neighbor_policy
  commands:
  - show running-config
  - show cdp neighbors detail
  automated: true
  scope: {}
  conditions:
    upstream_profile_key: root_guard.upstream_switches
    required_string: spanning-tree guard root
  result:
    pass_status: NotAFinding
    fail_status: Open
    error_status: Error
  evidence:
    include_command_output: false
    include_failed_objects: true
    pass_comment: Root Guard is configured on all CDP-identified access-switch-facing interfaces.
