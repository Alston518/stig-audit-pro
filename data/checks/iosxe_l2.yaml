- vuln_id: V-220655
  stig_id: CISC-L2-000090
  title: The Cisco switch must have Root Guard enabled on all switch ports connecting to access layer switches.
  looking_for: Use CDP to identify directly connected switches. Exempt configured core/distribution neighbors and require
    "spanning-tree guard root" on all other switch-facing interfaces.
