- vuln_id: CISC-L2-000030
  title: The Cisco switch must authenticate all VLAN Trunk Protocol (VTP) messages with a hash function using the most secured
    cryptographic algorithm available.
  stig_family: IOSXE_L2
  severity: cat2
  check_type: manual_review
  commands: []
  automated: false
  stig_id: CISC-L2-000030
  group_id: V-220650
  rule_id: SV-220650r539671_rule
  source_benchmark: Cisco IOS XE Switch L2S Security Technical Implementation Guide
  source_version: '3'
  source_release: 'Release: 2 Benchmark Date: 02 Jul 2025'
  check_text: 'Review the switch configuration to verify if VTP is enabled using the show vtp status command as shown in the
    example below: Switch#show vtp status VTP Version capable : 1 to 3 VTP version running : 1 VTP Domain Name : VTP Pruning
    Mode : Disabled VTP Traps Generation : Disabled Device ID : 5e00.0000.8000 Feature VLAN: -------------- VTP Operating
    Mode : Off Maximum VLANs supported locally : 1005 Number of existing VLANs : 5 Configuration Revision : 0 MD5 digest :
    0x57 0xCD 0x40 0x65 0x63 0x59 0x47 0xBD 0x56 0x9D 0x4A 0x3E 0xA5 0x69 0x35 0xBC Switch# If mode is set to anything other
    than off, verify that a password has been configured using the show vtp password command. Note: VTP authenticates all
    messages using an MD5 hash that consists of the VTP version + The VTP Password + VTP Domain + VTP Configuration Revision.
    If VTP is enabled on the switch and is not authenticating VTP messages with a hash function using a configured password,
    this is a finding.'
  fix_text: 'Configure the switch to authenticate all VLAN Trunk Protocol (VTP) messages with a hash function using a configured
    password as shown in the example below: SW1(config)#vtp password xxxxxxxxx'
  parser: {}
  scope: {}
  conditions: {}
  result:
    pass_status: NotAFinding
    fail_status: Not_Reviewed
    error_status: Error
