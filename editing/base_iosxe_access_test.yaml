# Editable test copy of data/profiles/base_iosxe_access.yaml.
# Use this file while developing checks so the production base profile is unchanged.
profile_name: base_iosxe_access_test
inherits: null
unused_vlan: 999
# Native VLAN used on trunk links. No access port may be assigned to this VLAN.
native_vlan: 333
# SVI used to populate HOST_IP in completed CKL files.
management_vlan: 300
disabled_port_policy:
  require_shutdown: true
  required_access_vlan: 999
trunk_policy:
  vlan_1_must_be_pruned: true
  additional_pruned_vlans: []
dhcp_snooping:
  enabled: true
  vlans:
  - 556
  - 565
  required_global_commands:
  - ip dhcp snooping
arp_inspection:
  enabled: true
  vlans:
  - 556
  - 565
root_guard:
  # Enter Device ID hostnames from "show cdp neighbors detail". Short names and FQDNs both match.
  # A matching core/distribution neighbor exempts only the local interface connected to that neighbor.
  upstream_switches: []
endpoint_authentication:
  # Match the name after: aaa group server radius <group-name>
  radius_group: ISE-RADIUS
  # List every required "server name" entry indented under that AAA group.
  radius_servers:
  - ISE1-EDU-01
  - ISE2-EDU-02
comments:
  default_open_prefix: Automated STIG validation found noncompliant configuration.
  default_pass_prefix: Automated STIG validation found required configuration present.
  default_error_prefix: Automated STIG validation could not confidently evaluate this requirement.
variables:
  site_label: Test IOS-XE access switch profile
  required_user_vlans:
  - 10
  - 20
  - 30
