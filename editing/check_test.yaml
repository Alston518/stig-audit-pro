library_name: iosxe_ndm_test

checks:
  - vuln_id: V-220569
    stig_id: CISC-ND-001470
    title: The Cisco switch must be running an IOS release that is currently supported by Cisco Systems.
    looking_for: Match the installed IOS-XE release against the profile-defined list of approved Cisco-supported versions
    stig_family: IOSXE_NDM
    severity: cat1
    check_type: command_pattern_policy
    commands:
      - show version
    automated: true
    scope: {}
    conditions:
      profile_any:
        - command: show version
          profile_key: supported_iosxe_versions
          object_type: iosxe_version
          escape_item: true
          pattern_template: '(?mi)^[^\r\n]*\bVersion[ \t]+{{ item }}(?=[,\t ]|$)[^\r\n]*$'
          description_template: profile-approved IOS-XE version {{ item }}
    result:
      pass_status: NotAFinding
      fail_status: Open
      error_status: Error
    evidence:
      include_command_output: false
      include_failed_objects: true
      pass_comment: The installed IOS-XE release matches a profile-defined version confirmed to be supported by Cisco.
      fail_comment: The installed IOS-XE release is not in the profile-defined list of Cisco-supported versions.
      error_comment: The installed IOS-XE release could not be evaluated.
      finding_details_template: default